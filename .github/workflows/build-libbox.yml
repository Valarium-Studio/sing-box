name: Build Android (AAR + APK)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_PLATFORM: android-34
      ANDROID_BUILD_TOOLS: 35.0.0

    steps:
      - name: Checkout (tags + submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Go 1.23.1
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # F-Droid совместимая связка: NDK r25c (устойчива для gomobile)
      - name: Install SDK bits
        run: |
          set -eux
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" "ndk;25.2.9519653"
          yes | sdkmanager --licenses
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: gomobile & gobind (SagerNet fork)
        run: |
          set -eux
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.7
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.7
          gomobile init

      # Builds libbox.aar via Makefile in repo root
      - name: Build libbox.aar via Makefile
        run: |
          set -eux
          make lib_android
          mkdir -p clients/android/app/libs
          mv libbox.aar clients/android/app/libs/

      - name: Build APK (otherDebug)
        working-directory: clients/android
        run: |
          set -eux
          ./gradlew :app:clean :app:assembleOtherDebug
          echo "==== Outputs ===="
          ls -R app/build/outputs || true
          echo "==== APKs ===="
          find app/build/outputs/apk -type f -name "*.apk" -maxdepth 3 -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sfa-build
          path: |
            clients/android/app/libs/libbox.aar
            clients/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
