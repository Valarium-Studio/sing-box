name: Build libbox AAR (arm64, sing-box v1.9.x)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 28.0.13004108    # r28b
      ANDROID_PLATFORM: android-34
      ANDROID_BUILD_TOOLS: 35.0.0
      GOTOOLCHAIN: local                    # do not auto-upgrade toolchain

    steps:
      # 1) Checkout sing-box at a Go 1.22-compatible tag (v1.9.x)
      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          ref: v1.9.5                      # <-- pin to a 1.9.x tag
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 2) Go 1.22.x for gomobile bind (avoids os.checkPidfdOnce)
      - name: Set up Go 1.22.6
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.6"

      # 3) Android cmdline-tools (sdkmanager in PATH)
      - name: Install Android cmdline-tools
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d latest
          mv latest/cmdline-tools/* latest/
          rm -rf latest/cmdline-tools cmdtools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # 4) Install platforms, build-tools, and NDK; verify NDK integrity
      - name: Install SDK + NDK (verify + fallback)
        env:
          NDK_VERSION: 28.0.13004108
          NDK_SHORT: r28b
        run: |
          set -eux
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" || true
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -f "${NDK_DIR}/meta/platforms.json" ]; then
            echo "NDK incomplete via sdkmanager, downloading direct zip..."
            mkdir -p "$ANDROID_SDK_ROOT/ndk"
            cd "$ANDROID_SDK_ROOT/ndk"
            curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_SHORT}-linux.zip"
            unzip -q ndk.zip
            rm -f ndk.zip
            rm -rf "${NDK_DIR}" || true
            mv "android-ndk-${NDK_SHORT}" "${NDK_DIR}"
          fi
          test -f "${NDK_DIR}/meta/platforms.json"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"

      # 5) gomobile tools (SagerNet fork) and init
      - name: Install gomobile & gobind
        run: |
          set -eux
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.7
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.7
          gomobile init

      # 6) Build AAR: arm64 only, minSdk=21 (required by NDK r28)
      - name: Build libbox.aar
        run: |
          set -eux
          mkdir -p clients/android/app/libs
          gomobile bind -v -target=android/arm64 -androidapi 21 \
            -o ./clients/android/app/libs/libbox.aar \
            github.com/sagernet/sing-box/experimental/libbox
          ls -lh clients/android/app/libs/libbox.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: clients/android/app/libs/libbox.aar
          if-no-files-found: error
