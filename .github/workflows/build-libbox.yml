name: Build libbox AAR (arm64)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 28.0.13004108
      ANDROID_PLATFORM: android-34
      ANDROID_BUILD_TOOLS: 35.0.0
      GOTOOLCHAIN: local  # use the local Go toolchain we set up

    steps:
      # 1) Checkout with submodules and tags (needed for version scripts)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # 2) Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) Go 1.23.1 (sing-box + gomobile are stable with it)
      - name: Set up Go 1.23.1
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"

      # 4) Install Android cmdline-tools and expose sdkmanager in PATH
      - name: Install Android cmdline-tools
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d latest
          # Flatten so sdkmanager ends up in .../latest/bin
          mv latest/cmdline-tools/* latest/
          rm -rf latest/cmdline-tools cmdtools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # 5) Install platforms, build-tools, NDK (with verification + fallback)
      - name: Install SDK platforms, build-tools, NDK (verify + fallback)
        env:
          NDK_VERSION: 28.0.13004108
          NDK_SHORT: r28b
        run: |
          set -eux
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" || true
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          # Verify NDK is complete (must have meta/platforms.json)
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -f "${NDK_DIR}/meta/platforms.json" ]; then
            echo "NDK via sdkmanager is incomplete. Falling back to direct zip download..."
            mkdir -p "$ANDROID_SDK_ROOT/ndk"
            cd "$ANDROID_SDK_ROOT/ndk"

            # Direct download of NDK r28b (maps to 28.0.13004108)
            curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_SHORT}-linux.zip"
            unzip -q ndk.zip
            rm -f ndk.zip

            # The folder is android-ndk-r28b; link it to the versioned path expected by tools
            rm -rf "${NDK_DIR}" || true
            mv "android-ndk-${NDK_SHORT}" "${NDK_DIR}"
          fi

          test -f "${NDK_DIR}/meta/platforms.json"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"

      # 6) gomobile & gobind (SagerNet fork) and init
      - name: Install gomobile & gobind
        run: |
          set -eux
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          gomobile init

      # 7) Build libbox.aar (arm64 only; NDK r28 requires minSdk 21)
      - name: Build libbox.aar
        run: |
          set -eux
          ls -la "$ANDROID_NDK_HOME/meta" || true    # debug
          mkdir -p clients/android/app/libs
          gomobile bind -v -target=android/arm64 -androidapi 21 \
            -o ./clients/android/app/libs/libbox.aar \
            github.com/sagernet/sing-box/experimental/libbox
          ls -lah clients/android/app/libs


      # 8) Upload artifact
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: clients/android/app/libs/libbox.aar
          if-no-files-found: error
